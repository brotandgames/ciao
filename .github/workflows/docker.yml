name: build and push docker image

on:
  push:
    tags:
      - '*'

env:
  DOCKERHUB_IMAGE: brotandgames/ciao
  GHCR_IMAGE: ghcr.io/brotandgames/ciao

permissions:
  contents: read
  packages: write

jobs:
  # Build each platform natively on its own runner (no QEMU emulation)
  # and push it by digest, the merge job tags them as one multi-arch image
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          # Release candidates (-rc) are pushed to GHCR only
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then
            echo "IMAGES=$GHCR_IMAGE" >> $GITHUB_ENV
          else
            echo "IMAGES=$DOCKERHUB_IMAGE,$GHCR_IMAGE" >> $GITHUB_ENV
          fi

      - name: checkout code
        uses: actions/checkout@v4

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: login to github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.IMAGES }}",push-by-digest=true,name-canonical=true,push=true
          # Reuse layers (eg. bundle install) from previous builds of this platform
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: login to github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create and push multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Release candidates (-rc) get only <tag> on GHCR,
          # releases get <tag> and latest on GHCR and Docker Hub
          tags="-t $GHCR_IMAGE:$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" != *-rc* ]]; then
            tags="$tags -t $GHCR_IMAGE:latest -t $DOCKERHUB_IMAGE:$GITHUB_REF_NAME -t $DOCKERHUB_IMAGE:latest"
          fi
          docker buildx imagetools create $tags $(printf "$GHCR_IMAGE@sha256:%s " *)

      - name: inspect images
        run: |
          docker buildx imagetools inspect $GHCR_IMAGE:$GITHUB_REF_NAME
          if [[ "$GITHUB_REF_NAME" != *-rc* ]]; then
            docker buildx imagetools inspect $DOCKERHUB_IMAGE:$GITHUB_REF_NAME
          fi
