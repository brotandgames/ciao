name: helm chart

# Lints the chart on every change and publishes it to
# oci://ghcr.io/<owner>/charts/ciao when its version is new.
# Not triggered by tags: those build the Docker image (docker.yml).
on:
  push:
    branches: [ master ]
    paths: [ 'helm-chart/**', '.github/workflows/helm.yml' ]
  pull_request:
    branches: [ master ]
    paths: [ 'helm-chart/**', '.github/workflows/helm.yml' ]

jobs:
  helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHART_DIR: helm-chart/ciao
      CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up helm
        uses: azure/setup-helm@v4

      - name: lint chart
        run: helm lint --strict "$CHART_DIR"

      - name: validate rendered manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          for values in \
            "" \
            "--set persistence.enabled=true --set ingress.enabled=true --set serviceMonitor.enabled=true --set env.PROMETHEUS_BASIC_AUTH_USERNAME=u --set env.PROMETHEUS_BASIC_AUTH_PASSWORD=p"; do
            helm template ciao "$CHART_DIR" $values | ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

      - name: publish chart if version is new
        if: github.event_name == 'push'
        run: |
          version=$(helm show chart "$CHART_DIR" | awk '/^version:/ {print $2}')
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          if helm show chart "$CHART_REGISTRY/ciao" --version "$version" > /dev/null 2>&1; then
            echo "ciao chart $version is already published"
            exit 0
          fi
          helm package "$CHART_DIR"
          helm push "ciao-$version.tgz" "$CHART_REGISTRY"
