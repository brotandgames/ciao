# Default values for ciao.
#
# ciao always runs as a single pod (no replicaCount): it schedules checks
# in-memory (rufus-scheduler) and stores its data in SQLite.

image:
  repository: brotandgames/ciao
  # Defaults to the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ciao is configured via ENV vars, see
# https://github.com/brotandgames/ciao#configuration
# They are stored in a Secret and loaded into the container via envFrom.
# SECRET_KEY_BASE (signs the session cookie: CSRF tokens and flash messages) is
# generated on install and kept on upgrades unless set here.
env: {}
  # TIME_ZONE: "Europe/Vienna"
  # BASIC_AUTH_USERNAME: "ciao"
  # BASIC_AUTH_PASSWORD: "sensitive_password"
  # SMTP_ADDRESS: smtp.yourhost.com
  # SMTP_PORT: 587
  # SMTP_DOMAIN: smtp.yourhost.com
  # SMTP_AUTHENTICATION: plain
  # SMTP_ENABLE_STARTTLS_AUTO: true  # or SMTP_SSL: true (eg. port 465)
  # SMTP_USERNAME: ciao
  # SMTP_PASSWORD: "sensitive_password"
  # SMTP_EMAIL_FROM: "ciao@yourhost.com"
  # SMTP_EMAIL_TO: "you@yourhost.com"

# Name of an existing Secret with additional ENV vars (eg. managed by
# sealed-secrets or external-secrets). Its keys take precedence over env.
existingSecret: ""

# Persist the SQLite database. Without it, all checks are lost when the pod restarts.
persistence:
  enabled: false
  # Use an existing PersistentVolumeClaim instead of creating one
  existingClaim: ""
  # Unset: use the cluster's default StorageClass. "-": storageClassName: ""
  # (disables dynamic provisioning, eg. together with volumeName)
  storageClass: ""
  # Bind to a specific PersistentVolume
  volumeName: ""
  accessMode: ReadWriteOnce
  size: 100Mi
  # Mount a sub folder of the volume instead of its root
  subPath: ""

service:
  type: ClusterIP
  port: 80
  annotations: {}

podAnnotations: {}

# The image runs as user/group 1000; fsGroup makes the volume writable for it
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: ciao.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: ciao-ingress-tls
  #    hosts:
  #      - ciao.local

# Prometheus Operator ServiceMonitor scraping ciao's /metrics endpoint
# Requires the monitoring.coreos.com/v1 CRDs (eg. kube-prometheus-stack).
# Sets env PROMETHEUS_ENABLED=true unless env.PROMETHEUS_ENABLED is set.
# If env.PROMETHEUS_BASIC_AUTH_USERNAME and env.PROMETHEUS_BASIC_AUTH_PASSWORD
# are set, they are used for scraping.
serviceMonitor:
  enabled: false
  # Set to true if PROMETHEUS_BASIC_AUTH_USERNAME and PROMETHEUS_BASIC_AUTH_PASSWORD
  # are in existingSecret instead of env
  basicAuthFromExistingSecret: false
  # Additional labels, eg. to match the serviceMonitorSelector of your Prometheus
  labels: {}
    # release: kube-prometheus-stack
  interval: 30s
  scrapeTimeout: 10s

resources: {}
  # requests:
  #   cpu: 50m
  #   memory: 256Mi
  # limits:
  #   memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}

livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 15
  successThreshold: 1
  failureThreshold: 4
  timeoutSeconds: 10
readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 15
  successThreshold: 1
  failureThreshold: 4
  timeoutSeconds: 10
