apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ciao.fullname" . }}-test-connection"
  labels:
    {{- include "ciao.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.37
      command: ['wget']
      args: ['-qO-', '{{ include "ciao.fullname" . }}:{{ .Values.service.port }}/version']
  restartPolicy: Never
