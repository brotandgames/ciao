{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ciao.fullname" . }}
  labels:
    {{- include "ciao.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- with .Values.persistence.storageClass }}
  {{- if eq "-" . }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- /* VolumeName is the pre-2.0.0 spelling, kept for compatibility */}}
  {{- with .Values.persistence.volumeName | default .Values.persistence.VolumeName }}
  volumeName: {{ . | quote }}
  {{- end }}
{{- end }}
