apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ciao.fullname" . }}
  labels:
    {{- include "ciao.labels" . | nindent 4 }}
spec:
  # Never run two pods at once: each would run its own in-memory scheduler
  # (duplicate checks and notifications) and they would share the SQLite volume
  replicas: 1
  strategy:
    type: Recreate
    # Removes the RollingUpdate defaults left on Deployments created by chart < 2.0.0,
    # otherwise upgrading fails with "may not be specified when strategy type is 'Recreate'"
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "ciao.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restart the pod when the env Secret changes (computed from the values, as
        # rendering secret.yaml again would generate a different SECRET_KEY_BASE)
        checksum/secret: {{ list .Values.env .Values.serviceMonitor.enabled | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ciao.selectorLabels" . | nindent 8 }}
    spec:
      # ciao does not use the Kubernetes API
      automountServiceAccountToken: false
      # ciao finds services via DNS; don't inject legacy <SERVICE>_PORT etc.
      # variables for every Service in the namespace
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "ciao.fullname" . }}
            {{- if .Values.existingSecret }}
            # Listed last, so its keys take precedence over env
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: sqlite
              mountPath: /app/db/sqlite
              {{- with .Values.persistence.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: sqlite
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "ciao.fullname" .) }}
      {{- end }}
