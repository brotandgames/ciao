{{- $fullName := include "ciao.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "ciao.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
  {{- if and .Values.serviceMonitor.enabled (not (hasKey .Values.env "PROMETHEUS_ENABLED")) }}
  PROMETHEUS_ENABLED: {{ "true" | b64enc | quote }}
  {{- end }}
  {{- if not (hasKey .Values.env "SECRET_KEY_BASE") }}
  {{- /* Generate once and keep it on upgrades. Otherwise ciao generates a new one on every
       start, and forms opened before a restart fail CSRF verification when submitted. */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $fullName }}
  {{- if and $existing $existing.data (hasKey $existing.data "SECRET_KEY_BASE") }}
  SECRET_KEY_BASE: {{ index $existing.data "SECRET_KEY_BASE" | quote }}
  {{- else }}
  SECRET_KEY_BASE: {{ randAlphaNum 128 | b64enc | quote }}
  {{- end }}
  {{- end }}
